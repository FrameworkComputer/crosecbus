[workspace]
members = ["crosec-proto", "crosecbus"]
resolver = "2"

[workspace.package]
edition = "2021"
publish = false
license = "Apache-2.0"

[workspace.metadata.wdk.driver-model]
driver-type = "KMDF"
kmdf-version-major = 1
target-kmdf-version-minor = 33

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true

[workspace.dependencies]
anyhow = "1.0.104"
paste = "1.0.15"
wdk = "0.5.0"
wdk-alloc = "0.4.2"
wdk-build = "0.6.0"
wdk-panic = "0.5.0"
wdk-sys = "0.5.2"
