extend = [{ path = "target/rust-driver-makefile.toml" }]

[env]
CARGO_MAKE_EXTEND_WORKSPACE_MAKEFILE = true
# DriverVer stamped into the INF (stampinf -v *). Keep in sync with
# crosecbus/Cargo.toml.
STAMPINF_VERSION = "0.1.0.0"

[config]
load_script = '''
#!@rust
//! ```cargo
//! [dependencies]
//! wdk-build = "0.6.0"
//! ```
#![allow(unused_doc_comments)]

wdk_build::cargo_make::load_rust_driver_makefile()?
'''
